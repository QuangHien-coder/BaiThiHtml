<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="img/note.png" alt="">
                <a href="index.html">Musical</a>
            </div>
            <nav>
                <ul class="nav-menu">
                    <li><a href="index.html">About Us</a></li>
                    <li><a href="index.html">Music</a></li>
                    <li><a href="index.html">Albums</a></li>
                </ul>
            </nav>
            <div class="header-btn">
                <a href="login.html" class="btn-signin">Sign In</a>
                <a href="login.html" class="btn-signup">Sign Up</a>
            </div>
        </header>

        <main>
            <form class="login-form" action="index.html">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="admin@gmail.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Password">
                </div>
                <div class="form-row">
                    <label class="remember">
                        <input type="checkbox" checked> Remember Me
                    </label>
                    <a href="#">Forgot password?</a>
                </div>
                <button type="submit" class="btn-login">LOGIN</button>
                <div class="register-link">
                    Not a member ? <a href="#">Register</a>
                </div>
            </form>
        </main>

        <footer>
            <img src="img/note.png" alt="">
            <span>Musical Entertaiment</span>
            <img src="img/note.png" alt="">
        </footer>
    </div>
</body>
</html>
